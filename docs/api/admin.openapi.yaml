openapi: 3.1.0
info:
  title: PestiRoute Administrative API
  version: 1.0.0
  description: See ../implementation/M11-BINDING.md for normative security and effect semantics.
servers:
  - url: https://localhost
security:
  - OperatorBearer: []
tags:
  - name: Status
  - name: Accounts
  - name: Credentials
  - name: Policies
  - name: Keys
  - name: Usage
  - name: Authentication
paths:
  /admin/v1/status:
    get:
      tags: [Status]
      operationId: getAdminStatus
      security: [{OperatorBearer: []}]
      responses:
        '200':
          description: Read-only startup snapshot; no provider requests.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      parameters:
        - {name: connector, in: query, schema: {type: string}}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Accounts, content: {application/json: {schema: {$ref: '#/components/schemas/AccountPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Accounts]
      operationId: createAccount
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountCreate'}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/accounts/{account_id}:
    get:
      tags: [Accounts]
      operationId: getAccount
      parameters: [{$ref: '#/components/parameters/AccountId'}]
      responses:
        '200': {description: Account, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/accounts/{account_id}/enabled:
    put:
      tags: [Accounts]
      operationId: setAccountEnabled
      parameters: [{$ref: '#/components/parameters/AccountId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EnabledUpdate'}}}}
      responses:
        '200': {description: Updated account, content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/accounts/{account_id}/credentials:
    post:
      tags: [Credentials]
      operationId: createCredential
      parameters: [{$ref: '#/components/parameters/AccountId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialCreate'}}}}
      responses:
        '201': {description: Write-only credential metadata; secret is not echoed., content: {application/json: {schema: {$ref: '#/components/schemas/Credential'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/accounts/{account_id}/credentials/{credential_id}:
    put:
      tags: [Credentials]
      operationId: replaceCredential
      parameters:
        - {$ref: '#/components/parameters/AccountId'}
        - {name: credential_id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CredentialReplace'}}}}
      responses:
        '200': {description: Write-only credential metadata, content: {application/json: {schema: {$ref: '#/components/schemas/Credential'}}}}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/policies:
    get:
      tags: [Policies]
      operationId: listPolicies
      parameters:
        - {name: enabled, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Policy revisions, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Policies]
      operationId: createPolicy
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyWrite'}}}}
      responses:
        '201': {description: Created revision 1, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/policies/{policy_id}:
    get:
      tags: [Policies]
      operationId: getPolicy
      parameters:
        - {name: policy_id, in: path, required: true, schema: {type: string}}
        - {name: revision, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Immutable policy revision, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}
        default: {$ref: '#/components/responses/Error'}
    put:
      tags: [Policies]
      operationId: updatePolicy
      parameters: [{name: policy_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PolicyUpdate'}}}}
      responses:
        '200': {description: New immutable revision, content: {application/json: {schema: {$ref: '#/components/schemas/Policy'}}}}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/keys:
    get:
      tags: [Keys]
      operationId: listKeys
      parameters:
        - {name: policy_id, in: query, schema: {type: string}}
        - {name: enabled, in: query, schema: {type: boolean}}
        - {name: revoked, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Redacted keys, content: {application/json: {schema: {$ref: '#/components/schemas/KeyPage'}}}}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Keys]
      operationId: createKey
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KeyCreate'}}}}
      responses:
        '201': {description: Raw key secret is returned only in this response., content: {application/json: {schema: {$ref: '#/components/schemas/IssuedKey'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/keys/{key_id}:
    get:
      tags: [Keys]
      operationId: getKey
      parameters: [{name: key_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Redacted key, content: {application/json: {schema: {$ref: '#/components/schemas/VirtualKey'}}}}
        default: {$ref: '#/components/responses/Error'}
    delete:
      tags: [Keys]
      operationId: revokeKey
      parameters: [{name: key_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Revoked key, content: {application/json: {schema: {$ref: '#/components/schemas/VirtualKey'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/keys/{key_id}/policy:
    put:
      tags: [Keys]
      operationId: updateKeyPolicy
      parameters: [{name: key_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KeyPolicyUpdate'}}}}
      responses:
        '200': {description: Updated key, content: {application/json: {schema: {$ref: '#/components/schemas/VirtualKey'}}}}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/usage/requests:
    get:
      tags: [Usage]
      operationId: listUsageRequests
      parameters:
        - {name: key_id, in: query, schema: {type: string}}
        - {name: account_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Since'}
        - {$ref: '#/components/parameters/Until'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Requests and bounded attempt summaries, content: {application/json: {schema: {$ref: '#/components/schemas/RequestPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/usage/attempts:
    get:
      tags: [Usage]
      operationId: listUsageAttempts
      parameters:
        - {name: request_id, in: query, schema: {type: string}}
        - {name: account_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Since'}
        - {$ref: '#/components/parameters/Until'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {description: Attempts with nullable usage, content: {application/json: {schema: {$ref: '#/components/schemas/AttemptPage'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/usage/summary:
    get:
      tags: [Usage]
      operationId: getUsageSummary
      parameters:
        - {name: key_id, in: query, schema: {type: string}}
        - {name: account_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Since'}
        - {$ref: '#/components/parameters/Until'}
      responses:
        '200': {description: Aggregate ledger usage; unknown counters are null., content: {application/json: {schema: {$ref: '#/components/schemas/UsageSummary'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/auth/sessions:
    post:
      tags: [Authentication]
      operationId: startAuthentication
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthStart'}}}}
      responses:
        '200': {description: Completion or opaque continuation, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResult'}}}}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/auth/sessions/{session_id}/continue:
    post:
      tags: [Authentication]
      operationId: continueAuthentication
      parameters: [{name: session_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AuthContinue'}}}}
      responses:
        '200': {description: Updated auth status, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResult'}}}}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /admin/v1/auth/accounts/{account_id}/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAuthentication
      parameters: [{name: account_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Refresh result; no credentials are returned., content: {application/json: {schema: {$ref: '#/components/schemas/AuthRefresh'}}}}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    OperatorBearer: {type: http, scheme: bearer, bearerFormat: opaque operator token}
  parameters:
    AccountId: {name: account_id, in: path, required: true, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Since: {name: since, in: query, description: Inclusive RFC3339 lower bound., schema: {type: string, format: date-time}}
    Until: {name: until, in: query, description: Inclusive RFC3339 upper bound., schema: {type: string, format: date-time}}
  responses:
    Error:
      description: Sanitized error envelope.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    PageMetadata:
      type: object
      required: [limit, offset, total]
      properties:
        limit: {type: integer, minimum: 1, maximum: 500}
        offset: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    Status:
      type: object
      required: [version, readiness, components, routes]
      properties:
        version: {type: string}
        readiness: {type: string, enum: [ready, unavailable, unknown]}
        components: {type: array, items: {$ref: '#/components/schemas/ComponentStatus'}}
        routes: {type: array, items: {$ref: '#/components/schemas/RouteStatus'}}
    ComponentStatus:
      type: object
      required: [id, kind, implementation, health, capabilities]
      properties:
        id: {type: string}
        kind: {type: string}
        implementation: {type: string}
        health: {type: string, enum: [ready, unavailable, unknown]}
        protocols: {type: array, items: {type: string}}
        capabilities: {type: object, additionalProperties: {type: string, enum: [supported, unsupported, unknown]}}
    RouteStatus:
      type: object
      required: [protocol, mode, model, adapter_id, connector_id, account_id]
      properties:
        protocol: {type: string}
        mode: {type: string}
        model: {type: string}
        adapter_id: {type: string}
        connector_id: {type: string}
        account_id: {type: string}
    Account:
      type: object
      required: [id, connector, enabled, created_at, updated_at]
      properties:
        id: {type: string}
        connector: {type: string}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AccountCreate:
      type: object
      required: [id, connector]
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1}
        connector: {type: string, minLength: 1}
        enabled: {type: boolean, default: true}
    EnabledUpdate:
      type: object
      required: [enabled]
      additionalProperties: false
      properties: {enabled: {type: boolean}}
    AccountPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: '#/components/schemas/Account'}}}
    CredentialCreate:
      type: object
      required: [id, secret]
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1}
        secret: {type: string, minLength: 1, maxLength: 65536, writeOnly: true}
        expires_at: {type: [string, 'null'], format: date-time}
    CredentialReplace:
      type: object
      required: [secret, expected_revision]
      additionalProperties: false
      properties:
        secret: {type: string, minLength: 1, maxLength: 65536, writeOnly: true}
        expires_at: {type: [string, 'null'], format: date-time}
        expected_revision: {type: integer, minimum: 1}
    Credential:
      type: object
      required: [id, account_id, revision, expires_at, updated_at]
      properties:
        id: {type: string}
        account_id: {type: string}
        revision: {type: integer}
        expires_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    Policy:
      type: object
      required: [id, revision, enabled, models, connectors, rpm, tpm, created_at]
      properties:
        id: {type: string}
        revision: {type: integer, minimum: 1}
        enabled: {type: boolean}
        models: {type: array, items: {type: string}}
        connectors: {type: array, items: {type: string}}
        rpm: {type: integer, minimum: 0}
        tpm: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
    PolicyWrite:
      type: object
      required: [id, models, connectors, rpm, tpm]
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1}
        models: {type: array, items: {type: string}}
        connectors: {type: array, items: {type: string}}
        rpm: {type: integer, minimum: 0}
        tpm: {type: integer, minimum: 0}
    PolicyUpdate:
      type: object
      required: [expected_revision]
      additionalProperties: false
      properties:
        expected_revision: {type: integer, minimum: 1}
        models: {type: array, items: {type: string}}
        connectors: {type: array, items: {type: string}}
        rpm: {type: integer, minimum: 0}
        tpm: {type: integer, minimum: 0}
        enabled: {type: boolean, const: false, description: May disable but cannot re-enable a disabled policy.}
    PolicyPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: '#/components/schemas/Policy'}}}
    VirtualKey:
      type: object
      required: [id, key_id, policy_id, policy_revision, revision, enabled, revoked, created_at, revoked_at]
      properties:
        id: {type: string}
        key_id: {type: string}
        policy_id: {type: string}
        policy_revision: {type: integer}
        revision: {type: integer}
        enabled: {type: boolean}
        revoked: {type: boolean}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    KeyCreate:
      type: object
      required: [policy_id, policy_revision]
      additionalProperties: false
      properties:
        policy_id: {type: string}
        policy_revision: {type: integer, minimum: 1}
    IssuedKey:
      type: object
      required: [secret, key]
      properties:
        secret: {type: string, writeOnly: true, description: Returned only at creation.}
        key: {$ref: '#/components/schemas/VirtualKey'}
    KeyPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: '#/components/schemas/VirtualKey'}}}
    KeyPolicyUpdate:
      type: object
      required: [policy_id, policy_revision, expected_revision]
      additionalProperties: false
      properties:
        policy_id: {type: string}
        policy_revision: {type: integer, minimum: 1}
        expected_revision: {type: integer, minimum: 1}
    UsageRequest:
      type: object
      required: [id, key_id, policy_id, protocol, model, route_id, key_revision, policy_revision, accepted_at, state, finished_at, attempts]
      properties:
        id: {type: string}
        key_id: {type: string}
        policy_id: {type: string}
        protocol: {type: string}
        model: {type: string}
        route_id: {type: string}
        key_revision: {type: integer}
        policy_revision: {type: integer}
        accepted_at: {type: string, format: date-time}
        state: {type: string}
        finished_at: {type: [string, 'null'], format: date-time}
        attempts: {type: array, items: {$ref: '#/components/schemas/UsageAttempt'}}
    RequestPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: '#/components/schemas/UsageRequest'}}}
    UsageAttempt:
      type: object
      required: [id, request_id, ordinal, account_id, connector, route_id, state, estimate_tokens, committed, error_category, error_reason, dispatched_at, finished_at, usage, reservation]
      properties:
        id: {type: string}
        request_id: {type: string}
        ordinal: {type: integer}
        account_id: {type: string}
        connector: {type: string}
        route_id: {type: string}
        state: {type: string}
        estimate_tokens: {type: integer}
        committed: {type: boolean}
        error_category: {type: [string, 'null']}
        error_reason: {type: [string, 'null']}
        dispatched_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        usage: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/UsageMetrics'}]}
        reservation: {$ref: '#/components/schemas/Reservation'}
    Reservation:
      type: object
      required: [estimated_tokens, actual_tokens, effective_charge, state]
      properties:
        estimated_tokens: {type: integer, minimum: 0}
        actual_tokens: {type: [integer, 'null'], minimum: 0}
        effective_charge: {type: integer, minimum: 0}
        state: {type: string}
    UsageMetrics:
      type: object
      properties:
        input_tokens: {type: [integer, 'null'], minimum: 0}
        output_tokens: {type: [integer, 'null'], minimum: 0}
        reasoning_tokens: {type: [integer, 'null'], minimum: 0}
        cached_tokens: {type: [integer, 'null'], minimum: 0}
        source: {type: string}
        completeness: {type: string}
        recorded_at: {type: string, format: date-time}
    AttemptPage:
      allOf:
        - {$ref: '#/components/schemas/PageMetadata'}
        - type: object
          required: [items]
          properties: {items: {type: array, items: {$ref: '#/components/schemas/UsageAttempt'}}}
    UsageSummary:
      type: object
      required: [requests, attempts, input_tokens, output_tokens, reasoning_tokens, cached_tokens, estimated_tokens, actual_tokens, effective_charge]
      properties:
        requests: {type: integer, minimum: 0}
        attempts: {type: integer, minimum: 0}
        input_tokens: {type: [integer, 'null'], minimum: 0}
        output_tokens: {type: [integer, 'null'], minimum: 0}
        reasoning_tokens: {type: [integer, 'null'], minimum: 0}
        cached_tokens: {type: [integer, 'null'], minimum: 0}
        estimated_tokens: {type: integer, minimum: 0}
        actual_tokens: {type: [integer, 'null'], minimum: 0}
        effective_charge: {type: integer, minimum: 0}
    AuthStart:
      type: object
      required: [account_id]
      additionalProperties: false
      properties: {account_id: {type: string}}
    AuthContinue:
      type: object
      additionalProperties: false
      properties: {callback_input: {type: string, maxLength: 4096, writeOnly: true}}
    AuthResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [complete, continue]}
        session_id: {type: [string, 'null']}
        expires_at: {type: [string, 'null'], format: date-time}
        user_action: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/UserAction'}]}
    UserAction:
      type: object
      properties:
        verification_uri: {type: string, format: uri}
        user_code: {type: [string, 'null']}
        poll_interval_seconds: {type: [number, 'null'], exclusiveMinimum: 0}
    AuthRefresh:
      type: object
      required: [status, revision]
      properties:
        status: {type: string, const: refreshed}
        revision: {type: integer, minimum: 1}
